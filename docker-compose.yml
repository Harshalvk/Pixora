version: "3.9"

services:
  pixora-postgres:
    image: postgres
    container_name: pixora-postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=harshal
      - PGDATA=/data/postgres-pixora
    volumes:
      - postgres-pixora:/data/postgres-pixora

volumes:
  postgres-pixora:
